
<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Come To Learn Persian</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f6f3;margin:0;color:#173d32}
header{background:#123b32;color:white;text-align:center;padding:25px}
main{max-width:480px;margin:25px auto;padding:15px}
.card{background:white;padding:22px;border-radius:14px;box-shadow:0 3px 12px #0001;margin-bottom:18px}
input{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:7px;font-size:15px}
button{width:100%;padding:12px;margin-top:9px;border:0;border-radius:7px;background:#176b50;color:white;font-size:16px}
.note{text-align:center;line-height:1.8}
#message{white-space:pre-wrap;text-align:center;margin-top:15px}
</style>
</head>
<body>

<header>
<h2>آؤ فارسی سیکھیں</h2>
<h1>Come To Learn Persian</h1>
<p>Learn Persian Easily & Step by Step</p>
</header>

<main>
<div class="card">
<h2>نیا اکاؤنٹ بنائیں</h2>
<input id="name" placeholder="آپ کا مکمل نام">
<input id="father" placeholder="والد کا نام">
<input id="whatsapp" placeholder="WhatsApp نمبر">
<input id="country" placeholder="ملک">
<input id="city" placeholder="شہر">
<input id="gender" placeholder="جنس">
<input id="signupEmail" type="email" placeholder="Email">
<input id="signupPassword" type="password" placeholder="Password">
<button id="signupBtn">Sign Up / رجسٹریشن</button>
</div>

<div class="card">
<h2>اکاؤنٹ میں داخل ہوں</h2>
<input id="loginEmail" type="email" placeholder="Email">
<input id="loginPassword" type="password" placeholder="Password">
<button id="loginBtn">Login / داخل ہوں</button>
<button id="logoutBtn">Logout / باہر جائیں</button>
</div>

<div class="card note">
<h3>مرکز آموزش زبان فارسی</h3>
<p>معلم: قاری محمد آصف اصفہانی</p>
<p>WhatsApp: 00923049788712</p>
</div>

<p id="message"></p>
</main>

<script type="module">
import { createClient } from
'https://esm.sh/@supabase/supabase-js@2';
// اپنی Supabase Project URL یہاں لکھیں
const SUPABASE_URL = 'https://ywffwyxnmigjgtywbpil.supabase.co';

// اپنی Publishable Key یہاں لکھیں
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3ZmZ3eXhubWlnamd0eXdicGlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM3NjgxMDEsImV4cCI6MjEwOTM0NDEwMX0.dU9AUEEE78zbrzPlDNGpBrSDYcw03ry7stUlAE7FX90';

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
const message = document.getElementById('message');
  message.textContent = 'JavaScript کامیابی سے چل رہا ہے!';
document.getElementById('signupBtn').onclick = function() {
};
document.getElementById('signupBtn').addEventListener('click', async () => {
  const full_name = document.getElementById('name').value.trim();
  const father_name = document.getElementById('father').value.trim();
  const whatsapp = document.getElementById('whatsapp').value.trim();
  const country = document.getElementById('country').value.trim();
  const city = document.getElementById('city').value.trim();
  const gender = document.getElementById('gender').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPassword').value;

  if (!full_name || !email || !password) {
    message.textContent = 'نام، Email اور Password لازمی ہیں۔';
    return;
  }

  message.textContent = 'اکاؤنٹ بنایا جا رہا ہے...';

  const { error } = await supabase.auth.signUp({
    email,
    password,
    options: {
      data: {
        full_name,
        father_name,
        whatsapp,
        country,
        city,
        gender
      }
    }
  });

  message.textContent = error
    ? error.message
    : 'رجسٹریشن کی درخواست کامیاب! اگر Email confirmation فعال ہے تو اپنے Email کی تصدیق کریں۔';
});

document.getElementById('loginBtn').addEventListener('click', async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;

  message.textContent = 'Login ہو رہا ہے...';

  const { error } = await supabase.auth.signInWithPassword({
    email,
    password
  });

if (error) {
  message.textContent = error.message;
} else {
  message.textContent = 'آپ کامیابی سے Login ہو گئے ہیں۔';

  document.querySelectorAll('.card').forEach(card => {
    card.style.display = 'none';
  });

  const dashboard = document.createElement('div');
  dashboard.className = 'card';
  dashboard.innerHTML = `
    <h2>آؤ فارسی سیکھیں</h2>
    <h3>طالب علم کا ڈیش بورڈ</h3>
    <p>آپ کامیابی سے Login ہو گئے ہیں۔</p>
    <p>فارسی گرامر</p>
    <p>فارسی بول چال</p>
    <p>مکمل فارسی کورس</p>
    <button id="dashboardLogout">Logout / باہر جائیں</button>
  `;

  document.querySelector('main').prepend(dashboard);

  document.getElementById('dashboardLogout').addEventListener('click', async () => {
    await supabase.auth.signOut();
    location.reload();
  });
}
document.getElementById('logoutBtn').addEventListener('click', async () => {
  const { error } = await supabase.auth.signOut();
  message.textContent = error ? error.message : 'آپ Logout ہو گئے ہیں۔';
});
</script>

</body>
</html>
